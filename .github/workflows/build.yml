name: Build Chitragupt APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Create buildozer.spec
        run: |
          buildozer init

      - name: Configure Buildozer
        run: |
          sed -i 's/^title = .*/title = Chitragupt/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = chitragupt/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.chitragupt/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,sympy/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,db/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y automake libltdl-dev

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chitragupt-APK
          path: bin/*.apk
