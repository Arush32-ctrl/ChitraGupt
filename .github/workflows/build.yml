name: Build Chitragupt APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython

      - name: Create buildozer.spec
        run: |
          buildozer init

      - name: Configure Buildozer
        run: |
          sed -i 's/^title = .*/title = Chitragupt/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = chitragupt/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.chitragupt/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,sympy/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,db/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

       
        
       - name: Install Android SDK and Build Tools
  run: |
    export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
    export PATH=$JAVA_HOME/bin:$PATH
    java -version

    # baaki tumhara existing code yahin rahega...
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          mkdir -p "$SDK/cmdline-tools"
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$SDK/cmdline-tools"

          mv "$SDK/cmdline-tools/cmdline-tools" \
             "$SDK/cmdline-tools/latest"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$SDK" --licenses

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verify AIDL
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Searching for AIDL..."

          find "$SDK/build-tools" -name aidl -type f -print

          test -f "$SDK/build-tools/34.0.0/aidl"

          echo "AIDL FOUND"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chitragupt-APK
          path: bin/*.apk
