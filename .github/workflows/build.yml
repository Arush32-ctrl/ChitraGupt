name: Build Chitragupt APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Get project files
      # -----------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------
      # Python
      # -----------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------
      # Android SDK
      # -----------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-31"
          sdkmanager "build-tools;31.0.0"

          yes | sdkmanager --licenses


      # -----------------------------
      # Linux dependencies
      # -----------------------------

      - name: Install system dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # -----------------------------
      # Buildozer
      # -----------------------------

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython


      # -----------------------------
      # Create Buildozer config
      # -----------------------------

      - name: Create buildozer.spec
        run: |
          buildozer init


      # -----------------------------
      # Configure Buildozer
      # -----------------------------

      - name: Configure Buildozer
        run: |

          sed -i 's/^title = .*/title = Chitragupt/' buildozer.spec

          sed -i 's/^package.name = .*/package.name = chitragupt/' buildozer.spec

          sed -i 's/^package.domain = .*/package.domain = org.chitragupt/' buildozer.spec

          sed -i 's/^requirements = .*/requirements = python3,kivy,sympy/' buildozer.spec

          sed -i 's/^source.include_exts = .*/source.include_exts = py,db/' buildozer.spec

          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec


      # -----------------------------
      # Build APK
      # -----------------------------

      - name: Build APK
        run: |
          buildozer android debug


      # -----------------------------
      # Upload APK
      # -----------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chitragupt-APK
          path: bin/*.apk
