name: Build Chitragupt APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses


      - name: Install system dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython


      - name: Create Buildozer spec
        run: |
          buildozer init


      - name: Configure Buildozer
        run: |
          sed -i 's/^title = .*/title = Chitragupt/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = chitragupt/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.chitragupt/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,sympy/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,db/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          echo "android.ndk_path = $ANDROID_NDK_HOME" >> buildozer.spec


      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "AIDL found successfully"


      - name: Build APK
        run: |
          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chitragupt-APK
          path: bin/*.apk
